<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#17120f"><title>声览｜以耳代目，静听万象</title><style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#17120f;color:#eee3d5;font-family:system-ui,-apple-system,"Noto Sans SC",sans-serif}.wrap{max-width:760px;margin:auto;padding:24px 18px 150px}.brand{font-size:30px;font-weight:800;letter-spacing:5px}.sub{color:#a99a89;margin:4px 0 28px}.panel{background:#241c17;border:1px solid #493629;border-radius:20px;padding:18px;margin:14px 0}.cats{display:flex;flex-wrap:wrap;gap:9px}.cat,button{border:1px solid #60462f;background:#302319;color:#f3dfc8;border-radius:24px;padding:12px 16px;font-size:15px}.cat.active,button.primary{background:#dc9850;color:#21150c;border:0;font-weight:700}.search{display:flex;gap:9px;margin-top:18px}.search input{min-width:0;flex:1;background:#211a15;border:1px solid #5a4534;border-radius:14px;padding:14px;color:white;font-size:16px}.item{padding:14px 0;border-bottom:1px solid #493629}.muted{color:#a99a89;font-size:13px}.player{position:fixed;bottom:0;left:0;right:0;background:#211a16;border-top:1px solid #62472f;padding:14px max(18px,calc((100vw - 720px)/2));box-shadow:0 -10px 30px #0008}.controls{display:flex;align-items:center;justify-content:center;gap:14px;margin-top:10px}.big{width:60px;height:60px;border-radius:50%;font-size:23px}.status{color:#d9b58d;min-height:24px}.item button{padding:8px 12px;font-size:13px}
</style></head><body><main class="wrap"><div class="brand">声览</div><div class="sub">以耳代目 · 静听万象</div><section class="panel"><b>发现声音</b><p class="muted">搜索公开音频内容。只请求音频，不加载视频画面。</p><div class="cats" id="cats"></div><div class="search"><input id="q" value="科学科普" placeholder="搜索知识、故事、播客…"><button class="primary" id="go">搜索</button></div><p class="status" id="status">准备就绪</p><div id="results"></div></section><section class="panel"><b>使用说明</b><p class="muted">搜索服务由云端提供。不同平台可能受地区网络、版权和访问规则影响；仅播放你有权访问的公开音频。后台播放取决于手机浏览器设置。</p></section></main><div class="player"><div id="now">还没有选择音频</div><div class="controls"><button id="prev">上一条</button><button class="primary big" id="play">▶</button><button id="next">下一条</button></div><audio id="audio" controls style="width:100%;margin-top:10px"></audio></div><script>
const categories=['知识科普','历史人文','文学小说','语言学习','新闻时事','科技数码','教育课程','生活健康','故事访谈'];let chosen='知识科普',queue=[],idx=-1;const $=x=>document.getElementById(x);$('cats').innerHTML=categories.map(c=>`<button class="cat ${c===chosen?'active':''}" data-c="${c}">${c}</button>`).join('');$('cats').onclick=e=>{let c=e.target.dataset.c;if(!c)return;chosen=c;$('q').value=c;$('cats').querySelectorAll('button').forEach(b=>b.classList.toggle('active',b.dataset.c===c))};async function search(){let q=$('q').value.trim();if(!q)return;$('status').textContent='正在搜索公开音频…';$('results').innerHTML='';try{let r=await fetch('/api/search?q='+encodeURIComponent(q));let j=await r.json();queue=j.results||[];$('status').textContent=queue.length?`找到 ${queue.length} 条结果。点击条目尝试播放。`: (j.error||'没有找到结果，请更换关键词或稍后重试。');$('results').innerHTML=queue.map((x,i)=>`<div class="item"><b>${esc(x.title)}</b><div class="muted">${esc(x.creator||'')} · ${esc(x.source||'')}</div><button onclick="playAt(${i})">播放音频</button></div>`).join('')}catch(e){$('status').textContent='网络连接失败，请稍后重试。'}}function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}window.playAt=async i=>{idx=i;let x=queue[i];$('now').textContent=x.title;$('status').textContent='正在获取音频…';try{let r=await fetch('/api/audio?url='+encodeURIComponent(x.webpage_url));let j=await r.json();if(!j.url)throw Error(j.error||'此条内容暂不可播放');$('audio').src=j.url;await $('audio').play();$('status').textContent='正在播放纯音频'}catch(e){$('status').textContent='该来源暂不可播放：'+e.message}};$('go').onclick=search;$('q').addEventListener('keydown',e=>{if(e.key==='Enter')search()});$('play').onclick=()=>{if($('audio').paused)$('audio').play();else $('audio').pause()};$('next').onclick=()=>{if(idx+1<queue.length)playAt(idx+1)};$('prev').onclick=()=>{if(idx>0)playAt(idx-1)};$('audio').onended=()=>{if(idx+1<queue.length)playAt(idx+1)};
</script></body></html>
